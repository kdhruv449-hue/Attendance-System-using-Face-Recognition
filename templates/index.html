<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Face Attendance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        video {
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            background: #222;
        }

        button {
            margin: 12px 5px;
            padding: 12px 22px;
            cursor: pointer;
        }

        #status {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Face Attendance System</h1>
    <p>Allow camera access to identify a registered person.</p>

    <video id="camera" autoplay playsinline muted></video>

    <div>
        <button id="start">Start Camera</button>
        <button id="stop" disabled>Stop Camera</button>
    </div>

    <p id="status">Camera is stopped.</p>
    <canvas id="canvas" hidden></canvas>

    <script>
        const video = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");
        const start = document.getElementById("start");
        const stop = document.getElementById("stop");

        let stream = null;
        let timer = null;
        let busy = false;
        let lastRecognition = "";

        async function recognizeFrame() {
            if (!stream || busy || video.readyState < 2) return;

            busy = true;

            try {
                canvas.width = Math.min(video.videoWidth, 640);
                canvas.height = Math.round(
                    canvas.width * video.videoHeight / video.videoWidth
                );

                const ctx = canvas.getContext("2d");
                ctx.drawImage(
                    video, 0, 0, canvas.width, canvas.height
                );

                const response = await fetch("/recognize", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        image: canvas.toDataURL("image/jpeg", 0.75)
                    })
                });

                const result = await response.json();

                if (result.status === "recognized") {
                    const message = `${result.name}: ${result.attendance}`;

                    if (message !== lastRecognition) {
                        status.textContent = message;
                        lastRecognition = message;
                    }
                } else if (result.status === "unknown") {
                    status.textContent = result.message;
                    lastRecognition = "";
                } else {
                    status.textContent = result.message || "Recognition failed.";
                }
            } catch (error) {
                status.textContent = "Unable to contact the server.";
            } finally {
                busy = false;
            }
        }

        start.addEventListener("click", async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;
                start.disabled = true;
                stop.disabled = false;
                status.textContent = "Camera running. Looking for faces...";

                timer = setInterval(recognizeFrame, 2000);
            } catch (error) {
                status.textContent = "Camera access denied or unavailable.";
            }
        });

        stop.addEventListener("click", () => {
            clearInterval(timer);
            timer = null;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;
            start.disabled = false;
            stop.disabled = true;
            status.textContent = "Camera is stopped.";
        });

        window.addEventListener("beforeunload", () => {
            clearInterval(timer);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
